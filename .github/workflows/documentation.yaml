name: Docs

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install poetry
        run: |
          pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install --no-interaction --all-groups
          poetry run pip install "setuptools<82"
          poetry run pip install coverage-badge

      - name: Generate coverage-badge
        run: |
          poetry run pytest --cov=pydecoys
          mkdir -p docs/source/_static
          poetry run coverage-badge -o docs/source/_static/coverage.svg -f
          
      - name: Sphinx build
        run: |
          poetry run sphinx-build -W -b dirhtml docs/source docs/build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/
          force_orphan: true
