name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: pipx install poetry

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'poetry'
  
            - name: Install Dependencies
              run: |
                poetry install --no-interaction --all-groups
                pip install "setuptools<82"
                pip install coverage-badge

            - name: Run Tests
              run: |
                poetry run flake8
                poetry run doc8 docs/source/
                poetry run mypy pydecoys/
                poetry run python3 -m doctest pydecoys/**/*.py
                poetry run pytest --cov=pydecoys
            
            - name: Generate coverage badge
              run: |
                mkdir -p public
                coverage-badge -o public/coverage.svg -f
  
            - name: Generate coverage-badge
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./public
                publish_branch: gh-pages
