name: Tests
on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: pipx install poetry

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'poetry'
  
            - name: Install Dependencies
              run: poetry install --no-interaction --all-groups

            - name: Run Tests
              run: |
                poetry run flake8
                poetry run doc8 docs/source/
                poetry run mypy pydecoys/
                poetry run python3 -m doctest pydecoys/**/*.py
                poetry run pytest
