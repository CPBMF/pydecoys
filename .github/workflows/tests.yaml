name: Tests

permissions:
  contents: write

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Install Poetry
              run: pipx install poetry

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                python-version: '3.12'
                cache: 'poetry'
  
            - name: Install Dependencies
              run: |
                poetry install --no-interaction --all-groups
                pip install "setuptools<82"
                pip install coverage-badge

            - name: Run Tests
              run: |
                poetry run flake8
                poetry run doc8 docs/source/
                poetry run mypy pydecoys/
                poetry run python3 -m doctest pydecoys/**/*.py
                poetry run pytest --cov=pydecoys
            
            - name: Generate coverage badge
              run: |
                mkdir -p docs/source/_static
                coverage-badge -o docs/source/_static/coverage.svg -f

            - name: Push coverage-badge
              if: github.event_name == 'push' && github.ref == 'refs/head/main'
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add docs/source/_static/coverage.svg
                git diff --staged --quiet || git commit -m "Update coverage badge [skip ci]"
                git push
