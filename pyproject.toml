[project]
name = "pydecoys"
version = "0.1.0"
description = "Proteomics decoy utilities for Python"
license = "GPL-3.0-or-later"
authors = [
    { name = "Bruno Maestri A Becker", email = "bruno.maestri@edu.pucrs.br" }
]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    'python',
    'bioinformatics',
    'protein',
    'proteomics',
    'proteogenomics',
    'bionformatics-tool'
]


[project.urls]
hompegage = "https://github.com/CPBMF/pydecoys"
repository = "https://github.com/CPBMF/pydecoys"
documentation = "https://cpbmf.github.io/pydecoys/"
tracker = "https://github.com/CPBMF/pydecoys/issues"


[project.scripts]
pydecoys = "pydecoys.__main__:main"


[tool.poetry]
name = "pydecoys"
version = "0.1.0"
description = "Proteomics decoy utilities for Python"
license = "GPL-3.0-or-later"
authors = [ "Bruno Maestri A Becker <bruno.maestri@edu.pucrs.br>" ]
readme = "README.md"


[tool.poetry.dependencies]
python = ">=3.12"


[tool.poetry.group.biopython.dependencies]
biopython = "^1.87"


[tool.poetry.group.dev]
optional = true


[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
flake8 = "^7.3.0"
pytest = "^9.0.3"


[tool.poetry.group.docs]
optional = true


[tool.poetry.group.docs.dependencies]
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.1.0"
doc8 = "^2.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.esbonio.sphinx]
buildCommand = ["sphinx-build", "-M", "dirhtml", ".", "./_build"]
pythonCommand = ["${venv:.venv}"]


[tool.doc8]
ignore = ["D004"]
ignore-path = [
    "docs/source/available.rst",
    "docs/build/*"
]
max-line-length = 79
